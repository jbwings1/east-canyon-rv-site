<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a2921">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Learn and practice Texas Hold'em skills — hand rankings, starting hands, pot odds, and decisions.">
  <title>Holdem Coach</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <p class="eyebrow">Holdem Coach</p>
      <h1 id="page-title">Home</h1>
    </header>

    <main id="main" class="main" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Primary">
      <button type="button" class="tab active" data-route="home">
        <span class="tab-icon" aria-hidden="true">♠</span>
        <span>Home</span>
      </button>
      <button type="button" class="tab" data-route="learn">
        <span class="tab-icon" aria-hidden="true">Aa</span>
        <span>Learn</span>
      </button>
      <button type="button" class="tab" data-route="practice">
        <span class="tab-icon" aria-hidden="true">◇</span>
        <span>Practice</span>
      </button>
      <button type="button" class="tab" data-route="table">
        <span class="tab-icon" aria-hidden="true">◎</span>
        <span>Table</span>
      </button>
      <button type="button" class="tab" data-route="progress">
        <span class="tab-icon" aria-hidden="true">%</span>
        <span>Progress</span>
      </button>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
